<title>charts</title>
<script>
  // why: one address for every device; a watch-sized screen gets the watch view of the same page.
  // why: Solve shows this page in a frame as its candles block (?view=embed); the block carries the title.
  if (new URLSearchParams(location.search).get("view") === "embed") document.documentElement.classList.add("embed");
  else if (Math.min(screen.width, screen.height) < 300) {
    const query = new URLSearchParams(location.search);
    query.set("view", "watch");
    location.replace(`/?${query}`);
  }
</script>
